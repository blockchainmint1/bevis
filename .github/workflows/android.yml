name: Android APK

# Sideload-only. No Play Store, no AAB.
# Every push to main (and every manual run) produces an installable APK
# you download from the run's "Artifacts" section.
#
# If the four signing secrets are configured in GitHub
# (BEVIS_KEYSTORE_BASE64, BEVIS_KEYSTORE_PASSWORD, BEVIS_KEY_ALIAS,
# BEVIS_KEY_PASSWORD) the APK is a properly signed release build.
# Without them it falls back to an unsigned debug build.
# See ANDROID_SIGNING.md for the exact copy/paste setup steps.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform
        run: bunx cap add android

      - name: Generate BEVIS app icons and splash screens
        run: |
          npm install --no-save --ignore-scripts=false --foreground-scripts @capacitor/assets@3 sharp
          npx capacitor-assets generate \
            --iconBackgroundColor '#0b0b10' \
            --iconBackgroundColorDark '#0b0b10' \
            --splashBackgroundColor '#0b0b10' \
            --splashBackgroundColorDark '#0b0b10'

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.BEVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing keystore configured - producing an unsigned debug APK."
          fi

      - name: Restore keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BEVIS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/bevis.jks
          test -s android/keystore/bevis.jks

      - name: Configure signing
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BEVIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BEVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BEVIS_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/android/keystore/bevis.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          python3 scripts/configure-android-signing.py


      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect APK
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk bevis.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk bevis.apk
          fi

      - name: Clean up secrets
        if: always()
        run: rm -f android/keystore.properties android/keystore/bevis.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bevis-apk
          path: bevis.apk
