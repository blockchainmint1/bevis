name: Android build

# Debug APK on every push to main (artifact only).
# Signed release AAB + APK when you push a tag like v1.4.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: bevis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ---- Release (tag pushes only) ----
      - name: Restore keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/bevis.keystore

      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          BEVIS_STORE_FILE: bevis.keystore
          BEVIS_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BEVIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BEVIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/$BEVIS_STORE_FILE \
            -Pandroid.injected.signing.store.password=$BEVIS_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$BEVIS_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$BEVIS_KEY_PASSWORD

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: bevis-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
