name: Android APK

# Sideload-only. No Play Store, no AAB, no signing keystore.
# Every push to main (and every manual run) produces an installable APK
# you download from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bevis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bevis-apk
          path: bevis.apk
